server:
  port: ${SERVER_PORT:8080}
  # 收到 SIGTERM 后先停止接新请求，等在途请求处理完再退出
  shutdown: graceful

spring:
  application:
    name: demo
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
